<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YONO SBI Case Study — Aradhika Patil</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; padding: 0; background: #FAF8F5; color: #0C2B3A; font-family: Geist, Arial, sans-serif; font-size: 17px; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    header { position: fixed; inset: 0 0 auto; z-index: 50; background: #faf8f5e8; backdrop-filter: blur(12px); padding: 18px 4vw; }
    .nav-inner { max-width: 1280px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    header img { height: 48px; width: auto; }
    nav { display: flex; gap: 38px; font: 20px 'Cormorant Garamond', Georgia, serif; }
    nav a[aria-current] { border-bottom: 1px solid #0c2b3a; }
    .talk { background: #fff; border: 1px solid #e7e4e0; border-radius: 99px; padding: 8px 23px; font: 20px 'Cormorant Garamond', Georgia, serif; box-shadow: 0 2px 3px #0000000c; }
    .back-container { padding-top: 96px; padding-left: 24px; padding-right: 24px; max-width: 1280px; margin: 0 auto; }
    .back { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; margin: 12px 0; color: #0C2B3A; text-decoration: none; }
    .back:hover { color: #7EAEC3; }
    main { width: 100%; margin: 0; padding: 0; }
    .full-doc-img { width: 100%; height: auto; display: block; margin: 0; padding: 0; border: none; }
    .top { position: fixed; bottom: 25px; right: 25px; background: #0c2b3a; color: white; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; z-index: 50; text-decoration: none; font-size: 20px; font-weight: bold; }
    @media(max-width: 650px) {
      header { padding: 15px 24px; }
      header img { height: 36px; }
      nav { gap: 17px; font-size: 17px; }
      .talk { display: none; }
      .back-container { padding-top: 80px; }
    }
  </style>
</head>
<body id="top">
  <header>
    <div class="nav-inner">
      <a href="/" aria-label="Home"><img src="/my logo design3.png" alt="Logo"></a>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/work" aria-current="page">Work</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </nav>
      <a class="talk" href="/contact">Let’s talk ↗</a>
    </div>
  </header>

  <div class="back-container">
    <a class="back" href="/#work">← Back to Selected Work</a>
  </div>

  <main>
    <img src="/sbi-case-study-full.png" alt="YONO SBI Case Study Document" class="full-doc-img" loading="eager" decoding="async">
  </main>

  <a class="top" href="#top" aria-label="Back to top">↑</a>
</body>
</html>
